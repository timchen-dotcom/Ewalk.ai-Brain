<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ewalk.ai Import Clients</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .bootstrap-shell {
        display: grid;
        gap: 18px;
        margin: 0 auto;
        max-width: 860px;
        padding: 48px 24px;
      }

      .bootstrap-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        display: grid;
        gap: 16px;
        padding: 22px;
      }

      .confirm-row {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr) auto;
      }

      input {
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font: inherit;
        min-height: 40px;
        padding: 0 12px;
      }

      pre {
        background: #f7fafb;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        margin: 0;
        max-height: 420px;
        min-height: 180px;
        overflow: auto;
        overflow-wrap: anywhere;
        padding: 14px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main class="bootstrap-shell">
      <section class="bootstrap-card">
        <div>
          <p class="eyebrow">Clients Import</p>
          <h1>正式匯入 Ewalk.ai 客戶名冊</h1>
        </div>
        <p>這一步只會寫入 <code>clients</code> 與一筆 <code>audit_logs</code>，不寫內容佇列、不發文、不碰廣告預算、不啟用 Blaze。</p>
        <div class="confirm-row">
          <input id="confirmText" autocomplete="off" placeholder="輸入：批准匯入客戶名冊" />
          <button class="primary-action" id="importButton" type="button">匯入 clients</button>
        </div>
        <pre id="log">等待明確批准...</pre>
      </section>
    </main>
    <script src="./firebase-config.local.js"></script>
    <script src="./data/client-registry.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
      import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

      const app = initializeApp(window.EWALK_FIREBASE_CONFIG);
      const auth = getAuth(app);
      const log = document.getElementById("log");
      const importButton = document.getElementById("importButton");
      const confirmText = document.getElementById("confirmText");
      const projectId = window.EWALK_FIREBASE_CONFIG.projectId;
      const expectedConfirm = "批准匯入客戶名冊";
      const params = new URLSearchParams(window.location.search);
      if (params.get("approved") === "1") {
        confirmText.value = expectedConfirm;
      }

      function writeLog(payload) {
        log.textContent = typeof payload === "string" ? payload : JSON.stringify(payload, null, 2);
      }

      function isIsoLike(value) {
        return typeof value === "string" && /^\d{4}-\d{2}-\d{2}T/.test(value) && !Number.isNaN(new Date(value).getTime());
      }

      function firestoreValue(value) {
        if (value === null || value === undefined) return { nullValue: null };
        if (typeof value === "string") return isIsoLike(value) ? { timestampValue: new Date(value).toISOString() } : { stringValue: value };
        if (typeof value === "boolean") return { booleanValue: value };
        if (typeof value === "number") return Number.isInteger(value) ? { integerValue: String(value) } : { doubleValue: value };
        if (Array.isArray(value)) return { arrayValue: { values: value.map((item) => firestoreValue(item)) } };
        if (typeof value === "object") {
          return { mapValue: { fields: Object.fromEntries(Object.entries(value).map(([key, child]) => [key, firestoreValue(child)])) } };
        }
        return { stringValue: String(value) };
      }

      function fields(data) {
        return Object.fromEntries(Object.entries(data).map(([key, value]) => [key, firestoreValue(value)]));
      }

      function normalizeStatus(status) {
        if (status === "提案中") return "proposal";
        if (status === "進行中" || status === "合作中") return "active";
        if (status === "暫停") return "paused";
        if (status === "結案") return "closed";
        return "pending_confirmation";
      }

      function buildClientDocument(client, now) {
        return {
          id: client.client_id,
          name: client.client_name,
          slug: client.client_id,
          status: normalizeStatus(client.status),
          display_status: client.status,
          industry: client.industry,
          source_path: client.source_path,
          primary_file: client.primary_file,
          service_tags: client.service_tags || [],
          import_readiness: client.import_readiness,
          next_action: client.next_action,
          command_center_enabled: true,
          content_queue_enabled: client.import_readiness === "ready_content_queue",
          formal_import_status: "approved_imported",
          folder_name: client.folder_name,
          file_count: client.file_count || 0,
          markdown_count: client.markdown_count || 0,
          folders: client.folders || [],
          updated_at: now,
          updated_by: "ashun",
          approved_by: "提姆先生",
        };
      }

      async function getAdminAccessToken() {
        const provider = new GoogleAuthProvider();
        provider.addScope("https://www.googleapis.com/auth/datastore");
        provider.setCustomParameters({ hd: "ewalk.ai", prompt: "consent" });
        const result = await signInWithPopup(auth, provider);
        if (result.user.email !== "tim.chen@ewalk.ai") throw new Error("只允許 tim.chen@ewalk.ai 匯入客戶名冊。");
        const credential = GoogleAuthProvider.credentialFromResult(result);
        if (!credential?.accessToken) throw new Error("沒有取得 Google OAuth access token。");
        return { accessToken: credential.accessToken, email: result.user.email };
      }

      async function importClients() {
        importButton.disabled = true;
        try {
          if (confirmText.value.trim() !== expectedConfirm) {
            throw new Error(`請先輸入「${expectedConfirm}」。`);
          }
          const registry = window.EWALK_CLIENT_REGISTRY;
          if (!registry?.clients?.length) throw new Error("找不到客戶名冊資料。");
          writeLog("正在取得 Google 管理授權...");
          const { accessToken, email } = await getAdminAccessToken();
          const now = new Date().toISOString();
          const auditId = `clients-import-${now.replace(/\D/g, "").slice(0, 14)}`;
          const writes = registry.clients.map((client) => ({
            update: {
              name: `projects/${projectId}/databases/(default)/documents/clients/${client.client_id}`,
              fields: fields(buildClientDocument(client, now)),
            },
          }));
          writes.push({
            update: {
              name: `projects/${projectId}/databases/(default)/documents/audit_logs/${auditId}`,
              fields: fields({
                id: auditId,
                action: "clients_import",
                target_collection: "clients",
                client_count: registry.clients.length,
                approved_by: "提姆先生",
                performed_by: "ashun",
                project_id: projectId,
                source: "01_客戶",
                created_at: now,
              }),
            },
          });

          writeLog({ step: "commit", email, write_count: writes.length });
          const response = await fetch(`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents:commit`, {
            method: "POST",
            headers: {
              authorization: `Bearer ${accessToken}`,
              "content-type": "application/json",
            },
            body: JSON.stringify({ writes }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(`Firestore commit failed: ${response.status} ${JSON.stringify(body)}`);

          const verifyResponse = await fetch(`https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/clients/hansik-daily-hotpot`, {
            headers: { authorization: `Bearer ${accessToken}` },
          });
          const verifyBody = await verifyResponse.json().catch(() => ({}));
          if (!verifyResponse.ok || !verifyBody.name) throw new Error(`Firestore verify failed: ${verifyResponse.status} ${JSON.stringify(verifyBody)}`);

          writeLog({
            ok: true,
            project_id: projectId,
            imported_clients: registry.clients.length,
            audit_log: `audit_logs/${auditId}`,
            verified_document: verifyBody.name,
            finished_at: new Date().toISOString(),
          });
        } catch (error) {
          console.error(error);
          writeLog({
            ok: false,
            message: error.message,
          });
        } finally {
          importButton.disabled = false;
        }
      }

      importButton.addEventListener("click", importClients);
    </script>
  </body>
</html>
